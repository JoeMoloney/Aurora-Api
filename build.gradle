plugins {
    id "java"
    id "org.springframework.boot" version "3.2.6"
    id "io.spring.dependency-management" version "1.1.3"
    id "io.gitlab.plunts.plantuml" version "2.4.1"
    id "io.freefair.lombok" version "8.6"
}

group = "joe.aurora"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
}

def lombokVersion = "1.18.30"
def reactorVersion = "3.5.2"
def jakartaVersion = "5.0.0"

dependencies {
    implementation "org.springframework.boot:spring-boot-starter"
    implementation "org.springframework.boot:spring-boot-starter-webflux"
    implementation "org.springframework.boot:spring-boot-starter-data-r2dbc"
    implementation "org.projectlombok:lombok:$lombokVersion"
    implementation "io.projectreactor:reactor-core:$reactorVersion"
//    implementation "jakarta.servlet:jakarta.servlet-api:$jakartaVersion"

    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"

    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation platform("org.junit:junit-bom:5.10.0")
    testImplementation "org.junit.jupiter:junit-jupiter"
}

test {
    useJUnitPlatform()
}

classDiagrams {
    diagram {
        name("AuroraAPIStructure")
        //Scan only the main package
        include(packages().withName("joe.aurora"))
        writeTo(file("build/reports/structure.poml"))
    }
}